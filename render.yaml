services:
  - type: web
    name: grant-fit-auditor
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CANONICAL_WEB_URL
        value: https://wayan.com/grant-fit-auditor/
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: OPENAI_MODEL
        value: gpt-5-mini
